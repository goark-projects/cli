name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GOWORK: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Run tests
        run: go test ./... -count=1
      - name: Run vet
        run: go vet ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race detector
        run: go test -race ./... -count=1

  scaffold:
    name: Public scaffold smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOARK_RELEASE_TESTS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build generated project from public modules
        run: >-
          go test ./internal/scaffold -run
          TestCreateApp_whenReleaseModulesRequested_shouldBuildFromProxy -count=1

  publish:
    name: Publish release
    needs: [validate, race, scaffold]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate bilingual release notes
        shell: bash
        run: |
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          test -f "docs/releases/${GITHUB_REF_NAME}.zh-CN.md"
      - name: Publish archives and checksums
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish structured release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="docs/releases/${GITHUB_REF_NAME}.md"
          release_body="${RUNNER_TEMP}/release-notes.md"
          version="${GITHUB_REF_NAME#v}"

          {
            echo "Full [release notes for Goark CLI ${version}](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${release_notes}) are available in the repository. [中文](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/releases/${GITHUB_REF_NAME}.zh-CN.md)"
            echo
            tail -n +5 "${release_notes}"
          } > "${release_body}"

          gh release edit "${GITHUB_REF_NAME}" \
            --title "Goark CLI ${version}" \
            --notes-file "${release_body}" \
            --target main \
            --latest \
            --verify-tag
